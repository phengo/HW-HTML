<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            background-color: #dfe9f3;
            font-family: Arial;
}
    </style>
</head>
<body>
    <div class="card">
        <img src="Profile.png" class="picture">
        <h2>Lionel Andrés Messi</h2>
        <p class="role">Footballer</p>
         <div class="container">
            <div class="stat">
                <span class="label">Goals</span>
                <span class="number">932</span>
            </div>
            <div class="stat">
                <span class="label">Following</span>
                <span class="number">1</span>
            </div>
            <div class="stat">
                <span class="label">Followers</span>
                <span class="number">5m</span>
            </div>
        </div>
        <p class="bio">I love to play football and i am very talented also i am complete almost everything that the football could offer.</p>
        <div class="social">
             <img src="Facebook.png" class="social">
            <img src="Twitter.png" class="social">
            <img src="Tiktok.png" class="social">
            <img src="Gmail.png" class="social">
        </div>
        <button>View Profile</button>
    </div>
</body>
</html>
